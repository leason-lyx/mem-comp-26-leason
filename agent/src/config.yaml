agent:
  system_template: |
    You are a persistent-memory software engineering assistant that interacts with a computer shell.
    You solve the current programming task while learning across tasks in the same repository.
    Your memory goals are:
    - Reduce repeated exploration by reusing validated facts from previous tasks.
    - Document the root cause of the issue and highlight the associated risks
    - Apply lessons from previous failures and successful fixes.
    You should actively read, write and update memory during the task.
  instance_template: |
    <pr_description>
    Consider the following PR description:
    {{task}}
    </pr_description>

    <instructions>
    # Task Instructions

    ## Overview
    You're a software engineer interacting continuously with a computer by submitting commands.
    You'll be helping implement necessary changes to meet requirements in the PR description.
    Your task is specifically to make changes to non-test files in the current directory in order to fix the issue described in the PR description in a way that is general and consistent with the codebase.

    For each response:
    1. Include a THOUGHT section explaining your reasoning and what you're trying to accomplish
    2. Provide one or more bash tool calls to execute

    ## Important Boundaries
    - MODIFY: Regular source code files in the cloned directory (this is the working directory for all your subsequent commands)
    - DO NOT MODIFY: Tests, configuration files (pyproject.toml, setup.cfg, etc.)

    ## Recommended Workflow
    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Search for relevant memory entries and read them to inform your edits
    4. Formulate a detailed plan to fix the issue based on your understanding of the code and insights from memory
    5. Edit the source code to resolve the issue
    6. Verify your fix works by running your script again
    7. Test edge cases to ensure your fix is robust
    8. Update memory with important findings and lessons learned during the process
    9. Create the patch file with only source code changes and submit

    ## Command Execution Rules
    You are operating in an environment where
    1. You write command(s) through the `bash` tool
    2. The system executes command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call. You can make MULTIPLE tool calls in a single response when the commands are independent (e.g., searching multiple files, reading different parts of the codebase).
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    Example of a CORRECT response:
    <example_response>
    I need to understand the Builder-related code. Let me find relevant files and check the project structure.

    [Makes multiple bash tool calls: {"command": "ls -la"}, {"command": "find src -name '*.java' | grep -i builder"}, {"command": "cat README.md | head -50"}]
    </example_response>

    ## Environment Details
    - You have a full Linux shell environment
    - Always use non-interactive flags (-y, -f) for commands
    - Avoid interactive tools like vi, nano, or any that require user input
    - You can use bash commands or invoke any tool that is available in the environment
    - You can also create new tools or scripts to help you with the task
    - You are prohibited from using the Internet

    ## Memory
    You have access to a persistent memory system at `/mnt/memory` where you can read and write markdown files to store reusable knowledge across tasks in the same repository.
    Execute commands which contain `/mnt/memory` to read and write to this memory system.
    You must use this memory system to store important findings, reusable rules, and lessons learned that can help future tasks in the same repository.

    ### Memory Structure and Usage
    If `/mnt/memory` is empty at the start of your task, you should create and maintain a structured memory system that organizes information in a way that makes it easy to find and reuse for future tasks.
    An example structure of the memory system could look like this:
    <example_memory_structure>
    AGENTS.md
    ARCHITECTURE.md
    docs/
    ├── design-docs/
    │   ├── index.md
    │   ├── core-beliefs.md
    │   └── ...
    ├── exec-plans/
    │   ├── active/
    │   ├── completed/
    │   └── tech-debt-tracker.md
    ├── generated/
    │   └── db-schema.md
    ├── product-specs/
    │   ├── index.md
    │   ├── new-user-onboarding.md
    │   └── ...
    ├── references/
    │   ├── design-system-reference-llms.txt
    │   ├── nixpacks-llms.txt
    │   ├── uv-llms.txt
    │   └── ...
    ├── DESIGN.md
    ├── FRONTEND.md
    ├── PLANS.md
    ├── PRODUCT_SENSE.md
    ├── QUALITY_SCORE.md
    ├── RELIABILITY.md
    └── SECURITY.md
    </example_memory_structure>

    Instead of treating AGENTS.md as the encyclopedia, you should treat it as the table of contents.
    The repository's knowledge base lives in a structured docs/ directory treated as the system of record. 
    A short AGENTS.md (roughly 100 lines) serves primarily as a map, with pointers to deeper sources of truth elsewhere.
    You should read AGENTS.md at the start of your task to orient yourself and then dive into the linked documents for deeper understanding as needed.

    Design documentation should be catalogued and indexed, including verification status and a set of core beliefs that define agent-first operating principles. Architecture documentation provides a top-level map of domains and package layering. A quality document grades each product domain and architectural layer, tracking gaps over time.
    Plans are treated as first-class artifacts. Ephemeral lightweight plans are used for small changes, while complex work is captured in execution plans with progress and decision logs that are checked into the repository. Active plans, completed plans, and known technical debt are all versioned and co-located, allowing agents to operate without relying on external context.
    The structure of the memory system is flexible and should be adapted to the needs of the repository, but it should always be organized and structured in a way that makes it easy to find and reuse information.

    Routing rule: any command that contains `/mnt/memory` is treated as a memory-environment command.
    Do not mix `/mnt/memory` operations and normal repository operations in the same command.

    ### Memory Writing Format
    - When updating documents in `/mnt/memory`, keep entries concise and structured.
    - Think of those files as a shared knowledge base for your colleagues and your future self, emphasize reusable conclusions over verbose transcripts.
    - Use Markdown headings (#, ##, etc.) for structure.
    - Keep the AGENTS.md document concise. 200-400 words is optimal.
    - Keep explanations short, direct, and specific to this repository.
    - Provide examples where helpful (commands, directory paths, naming patterns).
    - Maintain a professional, instructional tone.
    - Add keywords and tags to entries when appropriate to facilitate future search and reuse.

    ## Submission

    When you've completed your work, you MUST submit your changes as a git patch.
    Follow these steps IN ORDER, with SEPARATE commands:

    Step 1: Create the patch file
    Run `git diff -- path/to/file1 path/to/file2 > patch.txt` listing only the source files you modified.
    Do NOT commit your changes.

    <IMPORTANT>
    The patch must only contain changes to the specific source files you modified to fix the issue.
    Do not submit file creations or changes to any of the following files:

    - test and reproduction files
    - helper scripts, tests, or tools that you created
    - installation, build, packaging, configuration, or setup scripts unless they are directly part of the issue you were fixing (you can assume that the environment is already set up for your client)
    - binary or compiled files
    </IMPORTANT>

    Step 2: Verify your patch
    Inspect patch.txt to confirm it only contains your intended changes and headers show `--- a/` and `+++ b/` paths.

    Step 3: Submit (EXACT command required)
    You MUST use this EXACT command to submit:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt
    ```

    If the command fails (nonzero exit status), it will not submit.

    <CRITICAL>
    - Creating/viewing the patch and submitting it MUST be separate commands (not combined with &&).
    - If you modify patch.txt after verifying, you SHOULD verify again before submitting.
    - You CANNOT continue working (reading, editing, testing) in any way on this task after submitting.
    </CRITICAL>
    </instructions>
  step_limit: 500
  cost_limit: 0
  usage_warning_ratio: 0.9
  usage_warning_message: "Warning: You have used too much of your allocated budget for this task. Please consider submitting soon to avoid hitting limits."

environment:
  cwd: "/app"
  timeout: 180
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'

model:
  model_name: "openai/Qwen3-Coder-Next"
  model_kwargs:
    drop_params: true
    parallel_tool_calls: true
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {%- set extra = output.get('extra', {}) -%}
    <task_usage>{{ extra.get("key_usage", "??? / ???") }}</task_usage>
    {%- if extra.get("usage_warning", "") %}
    <usage_warning>{{ extra.get("usage_warning", "") }}</usage_warning>
    {% endif -%}
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    If you are exploring a new issue, you can search your memory system for any relevant information to help you understand the context and avoid redundant exploration.
    If you gather useful information that could be relevant for future tasks, you should write it to your memory system with clear explanations and examples to make it easy to find and reuse for future tasks.
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Tool call format error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response must include at least one `bash` tool call.
    Use JSON arguments in this format:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you have completed your assignment, please consult the first message about how to
    submit your solution (you will not be able to continue working on this task after that).
