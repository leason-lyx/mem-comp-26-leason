agent:
  system_template: |
    You are a helpful assistant that can interact with a computer shell to solve programming tasks.
  instance_template: |
    <pr_description>
    Consider the following PR description:
    {{task}}
    </pr_description>

    <instructions>
    # Task Instructions

    ## Overview
    You're a software engineer interacting continuously with a computer by submitting commands.
    You'll be helping implement necessary changes to meet requirements in the PR description.
    Your task is specifically to make changes to non-test files in the current directory in order to fix the issue described in the PR description in a way that is general and consistent with the codebase.

    For each response:
    1. Include a THOUGHT section explaining your reasoning and what you're trying to accomplish
    2. Provide one or more bash tool calls to execute

    ## Important Boundaries
    - MODIFY: Regular source code files in the cloned directory (this is the working directory for all your subsequent commands)
    - DO NOT MODIFY: Tests, configuration files (pyproject.toml, setup.cfg, etc.)

    ## Recommended Workflow
    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust

    ## Command Execution Rules
    You are operating in an environment where
    1. You write command(s) through the `bash` tool
    2. The system executes command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call. You can make MULTIPLE tool calls in a single response when the commands are independent (e.g., searching multiple files, reading different parts of the codebase).
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    Example of a CORRECT response:
    <example_response>
    I need to understand the Builder-related code. Let me find relevant files and check the project structure.

    [Makes multiple bash tool calls: {"command": "ls -la"}, {"command": "find src -name '*.java' | grep -i builder"}, {"command": "cat README.md | head -50"}]
    </example_response>

    ## Environment Details
    - You have a full Linux shell environment
    - Always use non-interactive flags (-y, -f) for commands
    - Avoid interactive tools like vi, nano, or any that require user input
    - You can use bash commands or invoke any tool that is available in the environment
    - You can also create new tools or scripts to help you with the task
    - You are prohibited from using the Internet

    ## Submission

    When you've completed your work, you MUST submit your changes as a git patch.
    Follow these steps IN ORDER, with SEPARATE commands:

    Step 1: Create the patch file
    Run `git diff -- path/to/file1 path/to/file2 > patch.txt` listing only the source files you modified.
    Do NOT commit your changes.

    <IMPORTANT>
    The patch must only contain changes to the specific source files you modified to fix the issue.
    Do not submit file creations or changes to any of the following files:

    - test and reproduction files
    - helper scripts, tests, or tools that you created
    - installation, build, packaging, configuration, or setup scripts unless they are directly part of the issue you were fixing (you can assume that the environment is already set up for your client)
    - binary or compiled files
    </IMPORTANT>

    Step 2: Verify your patch
    Inspect patch.txt to confirm it only contains your intended changes and headers show `--- a/` and `+++ b/` paths.

    Step 3: Submit (EXACT command required)
    You MUST use this EXACT command to submit:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt
    ```

    If the command fails (nonzero exit status), it will not submit.

    <CRITICAL>
    - Creating/viewing the patch and submitting it MUST be separate commands (not combined with &&).
    - If you modify patch.txt after verifying, you SHOULD verify again before submitting.
    - You CANNOT continue working (reading, editing, testing) in any way on this task after submitting.
    </CRITICAL>
    </instructions>
  step_limit: 600
  cost_limit: 0

memory:
  # Initial memory retrieval mode:
  # - semantic: existing FTS5 + overlap reranking based on the task text.
  # - latest: inject the newest inserted memories directly, ignoring the task text.
  retrieval_mode: semantic
  top_k: 10

  # Full field set written into memory.db.
  fields:
    # issue information
    - issue_description
    - issue_type
    - tags
    - outcome
    # factual memory
    - repository_context
    - problem_signature
    - relevant_artifacts
    - evidence
    - root_cause
    - codebase_constraints
    - fix_anchor
    - verification
    # experiential_memory
    - perspective
    - localization_strategy
    - modification_strategy
    - decision_rationale
    - reusable_procedure
    - pitfalls
    - failure_reflection
    - transfer_rule

  # Approximate total char budget for memory summary trajectory input.
  summary_total_char_limit: 136000

  # Optional per-field guidance for memory summarization LLM.
  # Keys not present in `fields` are ignored.
  field_descriptions:
    issue_description: "Problem statement with symptoms, trigger conditions, and expected behavior."
    issue_type: "A generalized category of the problem, such as parameter-handling bug, state-mutation bug, API misuse, test-environment failure, or localization error."
    tags: "Short retrieval-oriented keywords or phrases, separated by commas."
    outcome: "Whether the underlying experience was successful, failed, or mixed."

    repository_context: "Stable repository knowledge relevant to future tasks, such as architecture conventions, important subsystems, common APIs, recurring test setup requirements, or known module responsibilities."
    problem_signature: "Generalized description of the observed symptom, trigger condition, and expected behavior, written to match similar future issues."
    relevant_artifacts: "Important files, directories, classes, functions, configs, tests, or commands that were actually relevant to understanding or fixing the issue."
    evidence: "Concrete validated clues that support diagnosis, such as failing tests, stack traces, behavioral observations, code patterns, or contradictory hypotheses that were ruled out."
    root_cause: "The most likely root cause in concise and factual terms; if uncertain, store only validated causal evidence."
    codebase_constraints: "Project-specific constraints, invariants, compatibility requirements, interface contracts, or side-effect risks that must be respected."
    fix_anchor: "The key code location or design responsibility where the fix should conceptually land, even if the final patch touched multiple places."
    verification: "How correctness was checked, including reproduction tests, regression tests, environment setup, and any remaining uncertainty."

    perspective: "Abstract understanding of the problem that led, or should have led, to the right solution; focus on how to think about this kind of issue, not on specific identifiers."
    localization_strategy: "General strategy for narrowing the search space, including where to start, what signals to prioritize, and what misleading paths to avoid."
    modification_strategy: "Reusable repair pattern or design principle that explains how this class of issue should usually be fixed."
    decision_rationale: "Why the chosen repair direction was preferred over alternatives, including important tradeoffs such as safety, scope, backward compatibility, and maintainability."
    reusable_procedure: "A compact, replayable procedure or mini-demonstration for similar future tasks, such as inspect X, verify Y, patch Z, then run W."
    pitfalls: "Common mistakes, misleading symptoms, or anti-patterns that can waste time or produce brittle fixes."
    failure_reflection: "What a failed or partially failed attempt teaches: misunderstanding of the issue, wrong localization, unsafe edit pattern, or insufficient validation."
    transfer_rule: "A brief statement of when this experience should be reused, including the conditions under which it is likely applicable or not applicable."

compression:
  mode: "off"
  compressor_model_name: null
  timeout_s: 300
  summary:
    context_char_threshold: 100000
    keep_recent_steps: 20
    summary_prompt: |
      You are maintaining a context-aware state summary for an interactive agent working on software engineering tasks (specifically, bug fixes within the SWE-bench framework). You will be given a list of turns corresponding to actions taken by the agent and their resulting observations, and the most recent previous summary if one exists. Track:

      USER_CONTEXT: (Preserve essential user requirements, goals, and clarifications in concise form)

      COMPLETED: (Sub-tasks completed so far, with brief results)
      PENDING: (Key sub-tasks that still need to be done)
      CURRENT_STATE: (Current variables, data structures, or relevant environmental state not covered elsewhere)
      CODE_STATE: (File paths, function signatures, data structures followed by their current state)
      TESTS: (Failing cases, error messages, outputs)
      CHANGES: (Code edits, variable updates)
      DEPS: (Dependencies, imports, external calls)

      PRIORITIZE:

      1. Capture key user requirements and goals (from the initial issue)
      2. Distinguish between completed and pending sub-tasks clearly
      3. Keep all sections concise and relevant to fixing the issue
      4. Focus on information that quantifies the agent's progress towards a solution

      Example format:

      USER_CONTEXT: Fix a ZeroDivisionError in utils.calculate_ratio when denominator is zero. The function should return 0 in this case.
      COMPLETED:
      1. Reproduced ZeroDivisionError with calculate_ratio(5, 0).
      2. Identified missing check for denominator == 0 in utils.py.
      3. Added test case test_calculate_ratio_zero_denominator to tests/test_utils.py.
      4. Modified utils.calculate_ratio to return 0 if denominator is 0.
      5. Verified test_calculate_ratio_zero_denominator now passes.
      6. All tests in tests/test_utils.py are passing. 
      PENDING: 
      1. Prepare final patch file for submission. 
      CODE_STATE: 
      1. app/utils.py: calculate_ratio function MODIFIED.
      2. tests/test_utils.py: test_calculate_ratio_zero_denominator ADDED. 
      TESTS:
      1. tests/test_utils.py::test_calculate_ratio_zero_denominator: PASSED (previously FAILED).
      2. All tests in tests/test_utils.py: PASSED. 
      CHANGES:
      1. app/utils.py: calculate_ratio(): Added conditional if denominator == 0: return 0.
      2. tests/test_utils.py: Added test_calculate_ratio_zero_denominator to assert behavior with zero denominator. 
      DEPS: None modified.
  agentdiet:
    n_ctx_before: 2
    n_ctx_after: 1
    show_ctx: true
    step_char_threshold: 3000
    min_char_reduction: 1000
  obsmasking:
    min_age_steps: 10
    observation_char_threshold: 5000
    max_masks_per_query: 4
    placeholder_template: "Tool call result is ommitted."

environment:
  cwd: "/app"
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'

model:
  model_name: "litellm_proxy/gpt-5.2"
  # model_name: "litellm_proxy/deepseek-v3.2"
  model_kwargs:
    drop_params: true
    parallel_tool_calls: true
    timeout: 300
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    <task_cost>
    {{ output.task_cost_text or 'Current task cost: 0.0000 / unknown (budget unavailable).' -}}
    </task_cost>
    {% if output.task_cost_warning -%}
    <task_cost_warning>
    Cost usage is above 90% of budget. Stop broad exploration and finish the task quickly by submitting the best final answer.
    </task_cost_warning>
    {% endif -%}
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Tool call format error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response must include at least one `bash` tool call.
    Use JSON arguments in this format:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you have completed your assignment, please consult the first message about how to
    submit your solution (you will not be able to continue working on this task after that).
